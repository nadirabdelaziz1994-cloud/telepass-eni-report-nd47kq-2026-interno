name: Build Telepass ENI site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas openpyxl

      - name: Build site
        run: |
          python build_bundle.py
          python scripts/grab_go_patch.py
          if ls input/anagrafica/*.xlsx >/dev/null 2>&1; then
            python scripts/planning_standalone.py
            python scripts/planning_nadir_alias_patch.py
            python scripts/planning_excel_stable_patch.py
            python scripts/planning_ui_mobile_patch.py
          else
            echo "Planning standalone saltato: nessun file .xlsx in input/anagrafica"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
